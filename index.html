<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body class="min-h-screen flex justify-center items-center">
    <article class="flex flex-col items-center">
      <img
        class="rounded-full"
        src="./images/image-victor.jpg"
        alt="Profile picture of Victor Crest."
      />
      <div>
        <h1 class="text-preset-1-bold text-navy-950">Victor Crest</h1>
        <span class="text-preset-1-regular text-gray-500">26</span>
        <span class="text-preset-2">London</span>
      </div>
      <dl>
        <div>
          <dd class="text-preset-1-bold">80K</dd>
          <dt class="text-preset-3">Followers</dt>
        </div>
        <div>
          <dd class="text-preset-1-bold">803K</dd>
          <dt class="text-preset-3">Likes</dt>
        </div>
        <div>
          ź
          <dd class="text-preset-1-bold">1.4K</dd>
          <dt class="text-preset-3">Photos</dt>
        </div>
      </dl>
    </article>
  </body>
</html>
