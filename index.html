<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/output.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body
    class="min-h-screen flex justify-center items-center bg-blue-600 bg-pattern"
  >
    <article
      class="flex flex-col gap-300 items-center bg-white bg-pattern-card rounded-[15px] pt-700"
    >
      <div class="flex flex-col gap-4">
        <img
          class="rounded-full border-5 border-white"
          src="./images/image-victor.jpg"
          alt="Profile picture of Victor Crest."
        />
        <div class="flex flex-col items-center gap-2">
          <div class="flex gap-2">
            <h1 class="text-preset-1-bold text-navy-950">Victor Crest</h1>
            <span class="text-preset-1-regular text-gray-500">26</span>
          </div>
          <span class="text-preset-2 text-gray-500">London</span>
        </div>
      </div>
      <dl class="flex p-300 gap-700 border-t border-gray-100">
        <div>
          <dd class="text-preset-1-bold text-navy-950">80K</dd>
          <dt class="text-preset-3 text-gray-500">Followers</dt>
        </div>
        <div>
          <dd class="text-preset-1-bold text-navy-950">803K</dd>
          <dt class="text-preset-3 text-gray-500">Likes</dt>
        </div>
        <div>
          <dd class="text-preset-1-bold text-navy-950">1.4K</dd>
          <dt class="text-preset-3 text-gray-500">Photos</dt>
        </div>
      </dl>
    </article>
  </body>
</html>
